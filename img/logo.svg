<?xml version="1.0" encoding="UTF-8"?>
<!--
  Registrul Comerțului — modernised SVG badge
  Faithful structure: two scroll hooks · wide T-bar · shaft
  upward triangles · П-crown · circular text · bottom smile arc
  ViewBox 280×280 · single colour #C41829
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 280 280" width="280" height="280"
     role="img"
     aria-label="Registrul Comerțului — National Trade Register Office Romania">
  <title>Registrul Comerțului — Romania</title>

  <defs>
    <!--
      Top-half arc: clockwise from 9-o'clock (19,140) → 3-o'clock (261,140)
      via 12-o'clock. Baseline at r=121; glyphs ~12 px tall → tops at r≈133,
      inside outer ring at r=136.
    -->
    <path id="textArc" d="M 19,140 A 121,121 0 0 1 261,140"/>
  </defs>

  <!-- ════════════════════════════════ RINGS ══════ -->
  <circle cx="140" cy="140" r="139" fill="white"/>
  <circle cx="140" cy="140" r="136" fill="none" stroke="#C41829" stroke-width="3"/>
  <circle cx="140" cy="140" r="119" fill="none" stroke="#C41829" stroke-width="0.9"/>

  <!-- ══════════════════════════ CIRCULAR TEXT ═══ -->
  <text font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif"
        font-size="12" font-weight="bold" fill="#C41829" letter-spacing="5.2">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      REGISTRUL COMERȚULUI
    </textPath>
  </text>

  <!-- ══════════════════ BOTTOM SMILE + DOTS ═════
       Thin arc on the inner ring at the bottom, flanked by two dots.
       Dots at ~210° and ~330° from top (clock: 7-o'clock / 5-o'clock).
  -->
  <!-- Arc from left dot to right dot through bottom of circle, sweep=0 (CCW) -->
  <path d="M 80.5,243 A 119,119 0 0 0 199.5,243"
        fill="none" stroke="#C41829" stroke-width="1.2"/>
  <!-- Left dot -->
  <circle cx="80.5" cy="243" r="3" fill="#C41829"/>
  <!-- Right dot -->
  <circle cx="199.5" cy="243" r="3" fill="#C41829"/>

  <!-- ════════════════════ CENTRAL EMBLEM ════════

    Vertical centre line: x=140
    Emblem spans y=72 (top of scrolls) → y=220 (bottom of П-crown)

    ┌─────────────────────────────────────────────┐
    │  LEFT SCROLL     RIGHT SCROLL               │
    │   ╭───╮              ╭───╮                  │
    │   │   ╰──────────────╯   │                  │
    │ ══════════════════════════════ (T-bar)       │
    │         │shaft│                             │
    │   △               △  (triangles)            │
    │         │shaft│                             │
    │    ┌────┘     └────┐  (П-crown)             │
    │    │               │                        │
    │    └───────────────┘                        │
    └─────────────────────────────────────────────┘
  -->

  <!-- ── LEFT SCROLL
       A filled bezier shape: starts at T-bar level, sweeps left-up,
       hooks back right at apex (like a reversed J), returns to start.
  -->
  <path d="
    M 131,118
    C 112,114  100,97   108,79
    C 116,61   131,63   130,78
    C 129,90   130,108  131,118
    Z"
    fill="#C41829"/>

  <!-- ── RIGHT SCROLL  (mirror about x=140: x′ = 280-x) -->
  <path d="
    M 149,118
    C 168,114  180,97   172,79
    C 164,61   149,63   150,78
    C 151,90   150,108  149,118
    Z"
    fill="#C41829"/>

  <!-- ── T-BAR  (wide horizontal crossbar / stock) -->
  <rect x="82" y="118" width="116" height="13" rx="2" fill="#C41829"/>

  <!-- ── SHAFT  (narrow column, T-bar → П-crown) -->
  <rect x="132" y="131" width="16" height="38" rx="0" fill="#C41829"/>

  <!-- ── LEFT TRIANGLE  (upward-pointing, flanks shaft on the left)
       Centred midway between shaft left (132) and T-bar left (82): x=107.
       Apex touches T-bar bottom (y=131); base at y=163.
  -->
  <polygon points="107,131  89,163  125,163" fill="#C41829"/>

  <!-- ── RIGHT TRIANGLE  (mirror: shaft right=148, T-bar right=198 → centre=173) -->
  <polygon points="173,131  155,163  191,163" fill="#C41829"/>

  <!-- ── П-CROWN (lower anchor crown)
       A filled rectangle with a rectangular notch at the top centre
       matching the shaft width (16 px), forming an open П.
       Arms: x=108-132 and x=148-172 ; base connects at bottom y=220.
  -->
  <path d="
    M 108,220
    L 108,169
    L 132,169
    L 132,198
    L 148,198
    L 148,169
    L 172,169
    L 172,220
    Z"
    fill="#C41829"/>

</svg>
